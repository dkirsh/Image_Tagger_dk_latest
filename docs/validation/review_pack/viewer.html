<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review-Pack Viewer — Phase 1 species hypotheses</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b303b;
    --ink:#e7ebf2; --dim:#9aa4b2; --accent:#5b9dff;
    --accept:#39b37a; --reject:#e5615f; --uncertain:#e0a13a;
    --tag:#2a3140;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink)}
  header{padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:14px;align-items:center;position:sticky;top:0;z-index:5}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .muted{color:var(--dim)}
  .banner{background:#3a2b12;color:#f0c674;border:1px solid #5a4420;border-radius:6px;
          padding:3px 9px;font-size:12px;font-weight:600}
  .grow{flex:1}
  button,select,input[type=text]{font:inherit;color:var(--ink);background:var(--panel2);
        border:1px solid var(--line);border-radius:6px;padding:6px 10px}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  .controls{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);
            display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .controls label{color:var(--dim);font-size:12px;margin-right:4px}
  .leadbtn.active{border-color:var(--accent);background:#25324a}
  .count{margin-left:auto;color:var(--dim);font-size:13px}
  main{padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .card.decided-accept{border-left:4px solid var(--accept)}
  .card.decided-reject{border-left:4px solid var(--reject)}
  .card.decided-uncertain{border-left:4px solid var(--uncertain)}
  .path{font-size:12px;color:var(--dim);word-break:break-all}
  .sp{font-weight:650}
  .bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#3a6fb0,var(--accent))}
  .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--dim)}
  .tag{background:var(--tag);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px}
  .tag.boundary{color:#f0c674;border-color:#5a4420}
  .tag.coverage{color:#7fd1c0;border-color:#2c5148}
  .tag.abstain{color:#c9a0e8;border-color:#463055}
  .tag.present{color:#8fd6a8}.tag.absent{color:#e59a99}
  .actions{display:flex;gap:6px}
  .actions button{flex:1;padding:6px 0;font-weight:600}
  .b-accept.on{background:var(--accept);border-color:var(--accept);color:#04160e}
  .b-reject.on{background:var(--reject);border-color:var(--reject);color:#1a0505}
  .b-uncertain.on{background:var(--uncertain);border-color:var(--uncertain);color:#181203}
  .row2{display:flex;gap:6px}
  .row2 select{flex:1;font-size:12px;padding:5px 7px}
  .row2 input{flex:2;font-size:12px;padding:5px 7px}
  .empty{grid-column:1/-1;color:var(--dim);text-align:center;padding:40px}
  .filehint{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>Review-Pack Viewer <span class="muted" style="font-weight:400">· Phase 1 species hypotheses</span></h1>
  <span class="banner" id="calBanner">UNCALIBRATED · provisional severity</span>
  <span class="muted" id="manLine"></span>
  <span class="grow"></span>
  <label class="filehint">Load real replay (hypotheses .jsonl):</label>
  <input type="file" id="fileIn" accept=".jsonl,.json,.txt" style="max-width:220px">
  <button id="exportBtn">Export reviews ↓</button>
</header>

<div class="controls">
  <label>Species</label>
  <span id="leadBtns"></span>
  <select id="speciesSel"></select>
  <label>Bin</label>
  <select id="binSel">
    <option value="all">all</option>
    <option value="low">low (&lt;0.25)</option>
    <option value="intermediate">intermediate (0.25–0.6)</option>
    <option value="high">high (&gt;0.6)</option>
    <option value="boundary">boundary queue</option>
    <option value="coverage">coverage queue</option>
    <option value="abstain">abstain (late species)</option>
    <option value="undecided">undecided only</option>
  </select>
  <label>Sort</label>
  <select id="sortSel">
    <option value="value_desc">value ↓</option>
    <option value="value_asc">value ↑</option>
    <option value="unc_desc">uncertainty ↓</option>
    <option value="path">path</option>
  </select>
  <span class="count" id="countLine"></span>
</div>

<main id="grid"></main>

{"image_id": "suprematism/fixture_041_suprematism.png", "path": "suprematism/fixture_041_suprematism.png", "species": "variety", "value": 0.511, "presence": "present", "uncertainty": 0.112, "queue": ["boundary"], "model_version": "L6-fixture-0", "calibrated": false}
{"image_id": "suprematism/fixture_041_suprematism.png", "path": "suprematism/fixture_041_suprematism.png", "species": "textural_discomfort", "value": 0.308, "presence": "present", "uncertainty": 0.281, "queue": [], "model_version": "L6-fixture-0", "calibrated": false}

{"image_id": "suprematism/fixture_041_suprematism.png", "path": "suprematism/fixture_041_suprematism.png", "species": "concealed_order", "value": null, "presence": "abstain", "uncertainty": 0.82, "queue": [], "model_version": "L6-fixture-0", "calibrated": false}
`;
const EMBED_MAN = `{
  "corpus": "corpus_L6_FIXTURE",
  "n_images": 42,
  "n_manifest_rows": 42,
  "filesystem_only": [],
  "species": [
    "surface_density",
    "arrangement_disorder",
    "variety",
    "textural_discomfort",
    "semantic_incongruity",
    "concealed_order"
  ],
  "generated_commit": "fixture",
  "notes": "Synthetic fixture matching the Phase-1 artifact contract. NOT real replay data.",
  "manifest_hash": "3208b7e15cce6fdcb865ede96945bf815404a8559782d9175bb305ccec0c3450"
}`;
const SPECIES = ["surface_density","arrangement_disorder","variety","textural_discomfort","semantic_incongruity","concealed_order"];
const LEAD = ["surface_density","arrangement_disorder","textural_discomfort"];
const OBJECTIONS = ["—","wrong-presence","wrong-degree","species-misdefined","image-quality","ambiguous-exemplar","other"];

let ROWS = [];               // hypotheses
let MAN = {};                // manifest
const REVIEWS = {};          // key -> {decision, objection, note}
let curSpecies = "surface_density";

function keyOf(r){return r.image_id + "||" + r.species;}
function parseJSONL(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;try{out.push(JSON.parse(l));}catch(e){out._err=(out._err||0)+1;}});
  return out;
}
function loadData(hypTxt, manTxt){
  ROWS = parseJSONL(hypTxt);
  try{MAN = manTxt?JSON.parse(manTxt):{};}catch(e){MAN={};}
  const cal = ROWS.some(r=>r.calibrated===true);
  document.getElementById('calBanner').style.display = cal? 'none':'inline-block';
  document.getElementById('manLine').textContent =
    (MAN.corpus? MAN.corpus+" · ":"") + (MAN.n_images? MAN.n_images+" images":ROWS.length+" rows") +
    (MAN.filesystem_only&&MAN.filesystem_only.length? " · "+MAN.filesystem_only.length+" filesystem-only":"");
  render();
}
function bin(r){
  if(r.presence==="abstain") return "abstain";
  if(r.value==null) return "abstain";
  if(r.value<0.25) return "low";
  if(r.value<=0.6) return "intermediate";
  return "high";
}
function render(){
  const binSel=document.getElementById('binSel').value;
  const sort=document.getElementById('sortSel').value;
  let list=ROWS.filter(r=>r.species===curSpecies);
  list=list.filter(r=>{
    if(binSel==="all")return true;
    if(binSel==="boundary")return (r.queue||[]).includes("boundary");
    if(binSel==="coverage")return (r.queue||[]).includes("coverage");
    if(binSel==="undecided")return !REVIEWS[keyOf(r)];
    return bin(r)===binSel;
  });
  list.sort((a,b)=>{
    if(sort==="value_desc")return (b.value??-1)-(a.value??-1);
    if(sort==="value_asc")return (a.value??2)-(b.value??2);
    if(sort==="unc_desc")return (b.uncertainty??0)-(a.uncertainty??0);
    return a.path<b.path?-1:1;
  });
  const grid=document.getElementById('grid');
  grid.innerHTML="";
  if(!list.length){grid.innerHTML='<div class="empty">No rows for this species / bin.</div>';}
  list.forEach(r=>grid.appendChild(card(r)));
  const decided=ROWS.filter(r=>r.species===curSpecies&&REVIEWS[keyOf(r)]).length;
  const total=ROWS.filter(r=>r.species===curSpecies).length;
  document.getElementById('countLine').textContent=
    `${list.length} shown · ${decided}/${total} reviewed for ${curSpecies}`;
}
function card(r){
  const k=keyOf(r); const rev=REVIEWS[k]||{};
  const el=document.createElement('div');
  el.className='card'+(rev.decision?(' decided-'+rev.decision):'');
  const vtxt = r.value==null? '—' : r.value.toFixed(3);
  const vpct = r.value==null? 0 : Math.round(r.value*100);
  const qtags=(r.queue||[]).map(q=>`<span class="tag ${q}">${q}</span>`).join('');
  el.innerHTML=`
    <div class="path">${r.path}</div>
    <div class="sp">${r.species} <span class="muted" style="font-weight:400">· value ${vtxt}</span></div>
    <div class="bar"><i style="width:${vpct}%"></i></div>
    <div class="meta">
      <span class="tag ${r.presence}">${r.presence}</span>
      <span>unc ${r.uncertainty??'—'}</span>
      ${qtags}
      <span class="tag">${r.calibrated?'calibrated':'uncalibrated'}</span>
    </div>
    <div class="actions">
      <button class="b-accept ${rev.decision==='accept'?'on':''}">Accept</button>
      <button class="b-reject ${rev.decision==='reject'?'on':''}">Reject</button>
      <button class="b-uncertain ${rev.decision==='uncertain'?'on':''}">Uncertain</button>
    </div>
    <div class="row2">
      <select class="obj"></select>
      <input class="note" type="text" placeholder="reviewer note (optional)" value="${(rev.note||'').replace(/"/g,'&quot;')}">
    </div>`;
  const objSel=el.querySelector('.obj');
  OBJECTIONS.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o==='—'?'objection…':o;objSel.appendChild(op);});
  objSel.value=rev.objection||'—';
  const setDec=d=>{REVIEWS[k]={...(REVIEWS[k]||{}),decision:(REVIEWS[k]&&REVIEWS[k].decision===d)?null:d,
      objection:objSel.value,note:el.querySelector('.note').value};
      if(!REVIEWS[k].decision)delete REVIEWS[k]; render();};
  el.querySelector('.b-accept').onclick=()=>setDec('accept');
  el.querySelector('.b-reject').onclick=()=>setDec('reject');
  el.querySelector('.b-uncertain').onclick=()=>setDec('uncertain');
  objSel.onchange=()=>{if(REVIEWS[k]){REVIEWS[k].objection=objSel.value;}};
  el.querySelector('.note').onchange=e=>{if(REVIEWS[k]){REVIEWS[k].note=e.target.value;}};
  return el;
}
// ---- lead buttons + species select ----
const leadWrap=document.getElementById('leadBtns');
LEAD.forEach(sp=>{const b=document.createElement('button');b.className='leadbtn';b.textContent=sp;
  b.onclick=()=>{curSpecies=sp;syncSpecies();render();};leadWrap.appendChild(b);});
const sel=document.getElementById('speciesSel');
SPECIES.forEach(sp=>{const o=document.createElement('option');o.value=sp;o.textContent=sp;sel.appendChild(o);});
function syncSpecies(){sel.value=curSpecies;
  [...leadWrap.children].forEach(b=>b.classList.toggle('active',b.textContent===curSpecies));}
sel.onchange=()=>{curSpecies=sel.value;syncSpecies();render();};
document.getElementById('binSel').onchange=render;
document.getElementById('sortSel').onchange=render;
// ---- file load (real replay) — never mutates source ----
document.getElementById('fileIn').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{loadData(rd.result,EMBED_MAN);curSpecies="surface_density";syncSpecies();};
  rd.readAsText(f);
};
// ---- export (download; source untouched) ----
document.getElementById('exportBtn').onclick=()=>{
  const out={generated:new Date().toISOString(),corpus:MAN.corpus||null,
    model_version:(ROWS[0]||{}).model_version||null,
    n_reviews:Object.keys(REVIEWS).length,
    reviews:Object.entries(REVIEWS).map(([k,v])=>{const[image_id,species]=k.split("||");
      return{image_id,species,decision:v.decision,objection_category:v.objection&&v.objection!=='—'?v.objection:null,note:v.note||null};})};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='review_decisions.json';a.click();URL.revokeObjectURL(a.href);
};
// ---- boot with embedded fixture ----
syncSpecies();
loadData(EMBED_HYP, EMBED_MAN);
</script>
