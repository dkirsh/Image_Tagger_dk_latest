[pytest]
# The repository contains several applications and historical snapshots with
# different environments. The root suite contains the maintained tests that
# run in the repository's standard development environment.
testpaths =
    tests
    loop/tests
    validation
    annotation_socket/tests
    TRS_v1.1/tests

# Archived snapshots contain duplicate test module names and are historical.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} archive
